let st,rows=[],db=null,uid=null,busy=0,clk=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const sh=a=>[...a].sort(()=>Math.random()-.5);
const cur=()=>st.mode==="career"?S[st.d[st.i]]:st.d[st.i];
const chOf=q=>{const m=/Chapter (\d)/.exec(q.c||"");return m?+m[1]:0};
const CS=()=>Object.assign({g:0,best:0,rk:0},LS("mm_stats")||{});
const mx=t=>`<div class="tw"><table class="mx"><thead><tr>${t.h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${t.r.map(r=>`<tr>${r.map((x,i)=>i?`<td>${x}</td>`:`<th scope="row">${x}</th>`).join("")}</tr>`).join("")}</tbody></table></div>`;

/* ---------- 8-step table ---------- */
function stepsTbl(o){o=o||{};const active=o.active||0,spot=o.spot,stat=o.stat,fill=o.fill;
return `<div class="tw"><table class="steps${o.all?" all":""}" id="stp"><tbody>${STEPS.map((s,i)=>{const n=i+1,on=active===n,hid=fill&&!fill[i],sv=stat&&stat[i];
const mark=sv==="ok"?'<span class="okc" aria-label="Best call">✓</span>':sv==="no"?'<span class="noc" aria-label="Missed">✗</span>':on?'<span class="here">You are here</span>':"";
const nm=hid?'<span class="q">?</span>':esc(s[0]);
const cell=spot&&!hid?`<button class="rowb" data-a="spot" data-k="${n}">${nm}</button>`:`<b>${nm}</b>`;
return `<tr id="r${n}" class="${on?"on":""}${hid?" hid":""}"><th scope="row">${n}</th><td>${cell}<span class="mean">${hid?"":esc(s[1])}</span></td><td class="stt">${mark}</td></tr>`}).join("")}</tbody></table></div>`}
function proc(q,spot){const note=spot?`<p class="mute" id="spm">Bonus: tap the step this scenario is testing before you answer. The right step earns +25.</p>`:q.p?"":`<p class="mute">${esc(q.n||"No single step here. This scenario tests a concept from the chapter, but every decision still moves through these eight steps.")}</p>`;
return `<details class="proc"${q.p>0?" open":""}><summary>The 8-step decision process${spot?'<span class="bonus">+25 bonus</span>':""}</summary>${note}<div id="tbl">${stepsTbl({active:spot?0:q.p,spot,stat:st.mode==="case"?st.stat:null,all:st.all})}</div>${spot?"":'<button class="go alt sm" data-a="all">Show what each step means</button>'}</details>`}
const briefHtml=q=>`<aside class="brief"><b>Briefing${q.p?` · Step ${q.p}, ${STEPS[q.p-1][0]}`:""}</b><p>${q.b}</p></aside>`;

if(k==="c"){const best=Math.max(...q.o.map(x=>x[2])),cand=q.x.map((_,j)=>j).filter(j=>q.x[j][2]<best&&!c.gone.includes(j));if(!cand.length)return;

function resolve(o,k,to){const q=cur(),c=st.cq,fr=left();stopClock();

if(st.mode==="case"){st.stat[q.p-1]=ok?"ok":"no";$("#tbl").innerHTML=stepsTbl({active:q.p,stat:st.stat,all:st.all})}
const g=GR(o[2]),head=to?"Out of time":ok?"Best call":o[2]>=50?"Decent, not ideal":"Costly move";
const bd=[o[2]+" for the call",bonus?"+"+bonus+" streak":"",speed?"+"+speed+" speed":"",c.pen?"−"+c.pen+" lifelines":""].filter(Boolean).join(", ");
const stepNote=q.p?`<p class="mute"><b>Step ${q.p}, ${STEPS[q.p-1][0]}.</b> ${STEPS[q.p-1][1]}</p>`:"";

if(!f&&ri>=5)E.push("board");
const got=LS("mm_badges")||[],nw=E.filter(x=>!got.includes(x));if(nw.length)LS("mm_badges",got.concat(nw));
const cs=CS();cs.g++;if(st.mode==="career"&&t>cs.best)cs.best=t;if(!f&&ri>cs.rk)cs.rk=ri;LS("mm_stats",cs);
if(st.mode==="career")save(t);
const nx=!f&&RK[ri+1],prog=f?"":nx?`${th(ri+1,st.k)-t} points short of ${nx[1]}.`:"You hold the top rank.";
const line=f?`Your ${MET[st.m.findIndex(v=>v<=0)][1].toLowerCase()} hit zero. The board let you go.`:st.mode==="case"?`You closed the ${esc(st.cs.n)} case file.`:sp?"Quick-fire round complete.":`You made all ${N} decisions.`;
const nb=nw.length?`<h2>New badges</h2><div class="badges">${nw.map(id=>{const b=BADGES.find(x=>x[0]===id);return `<div class="bd"><span class="ic">${b[1]}</span><b>${b[2]}</b><small>${b[3]}</small></div>`}).join("")}</div>`:"";
A.innerHTML=`<div class="hero end in"><div class="scene"><span>${r[2]}</span></div><p class="mute">${line}</p><h1>${r[1]}</h1><div class="big">${t}</div><p class="mute">points${sp?"":" · "+st.m.map((v,i)=>MET[i][0]+" "+v).join("  ")}</p><p class="mute">${prog}</p>${nb}${st.mode==="career"?chapRep():stepRep()}${logRep()}<button class="go" data-a="start" data-k="${st.mode}">Play again</button><button class="go alt" data-a="home">Home</button>${st.mode==="career"?`<h2>Top managers</h2><div id="lb">${lb()}</div>`:""}</div>`;
window.scrollTo(0,0);if(!f)boom()}

/* ---------- events ---------- */
A.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,k=b.dataset.k;
if(a==="pick")pick(+k);else if(a==="start")start(k||"career");else if(a==="home")home();else if(a==="nxt")nxt();else if(a==="fire")end(1);
else if(a==="ll")lifeline(k);else if(a==="spot")(st.mode==="sprint"?sprintTap(+k):spotPick(+k));else if(a==="chip")chip(+k);else if(a==="sq")sprintAsk();else if(a==="sn")sprintNext();else if(a==="all")toggleAll(b)});
A.addEventListener("change",e=>{if(e.target.id==="pr")LS("mm_pr",e.target.checked)});
home();
(async()=>{try{if(!window.claude)return;const u=await claude.use("user");uid=u?await u.id():null;const d=await claude.use("db");
if(d&&uid){db=d;db.collection("scores").orderBy("best","desc").limit(10).onSnapshot(s=>{rows=s.docs.map(x=>({id:x.id,...x.data()}));const l=$("#lb");if(l)l.innerHTML=lb()},()=>{db=null})}}catch(e){}})();
</script>
