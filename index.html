  <style>
:root{--red:#e62b1e;--red-d:#c4200f;--ink:#0a0a0a;--mut:#8a8a8a;--soft:#f5f5f5;--max:1160px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{overflow-x:clip;margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
section{padding:96px 0;scroll-margin-top:64px}
.dark{background:var(--ink);color:#fff}
.soft{background:var(--soft)}
h1,h2,h3{line-height:1.05;margin:0}
h2{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.02em}
.eyebrow{color:var(--red);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin:0 0 14px}
.lead{font-size:19px;color:#444;max-width:720px;margin:18px 0 0}
.dark .lead{color:#bdbdbd}
.head{margin-bottom:48px}
.pl{white-space:pre-line}
.mt{margin-top:28px}

/* nav */
nav{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #222}
.navin{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;font-size:22px;color:#fff;text-decoration:none;letter-spacing:-.02em;display:inline-flex;align-items:baseline;gap:6px}
.logo b{color:var(--red)}
.logo sup{color:var(--red);font-size:.62em;font-weight:400;position:relative;top:-.5em;margin-left:-4px}
.logo span{font-weight:300}
.links{display:flex;gap:26px;align-items:center}
.links a.lk{color:#cfcfcf;text-decoration:none;font-size:14px;font-weight:500}
.links a.lk:hover{color:#fff}
.tag{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}

/* buttons */
.btn{display:inline-block;border:2px solid var(--red);background:var(--red);color:#fff;padding:13px 26px;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border-radius:2px}
.btn:hover{background:var(--red-d);border-color:var(--red-d)}
.btn.ghost{background:transparent;color:#fff;border-color:#fff}
.btn.ghost:hover{background:#fff;color:var(--ink)}
.btn.line{background:transparent;color:#111;border-color:#111}
.btn.line:hover{background:#111;color:#fff}
.dark .btn.line{color:#fff;border-color:#fff}
.dark .btn.line:hover{background:#fff;color:var(--ink);border-color:#fff}
.btn.sm{padding:8px 16px;font-size:13px}
.sm{font:inherit;font-size:12px;font-weight:700;padding:5px 10px;border:1px solid #bbb;background:#fff;color:#111;cursor:pointer;border-radius:2px}
.sm:hover{border-color:var(--red);color:var(--red)}
.sm.danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{font-size:13px;padding:8px 16px}
.cta{display:flex;gap:14px;flex-wrap:wrap}

/* hero */
.hero{position:relative;background:#000;color:#fff;overflow:hidden;padding:150px 0 130px;isolation:isolate}
.hero::before{content:"";position:absolute;right:-14%;top:-35%;width:70vw;height:70vw;max-width:920px;max-height:920px;background:radial-gradient(circle,rgba(230,43,30,.55),rgba(230,43,30,0) 62%);z-index:-1}
.herobg{position:absolute;inset:0;z-index:-1}
.herobg img{width:100%;height:100%;object-fit:cover;opacity:.38}
.hero h1{font-size:clamp(48px,9vw,120px);font-weight:800;letter-spacing:-.04em;max-width:980px}
.hero h1 em{font-style:normal;color:var(--red)}
.hero .sub{font-size:clamp(18px,2vw,22px);color:#d0d0d0;max-width:640px;margin:28px 0 40px}

/* stats */
.stats{background:var(--ink);color:#fff;border-top:1px solid #222;padding:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{padding:44px 28px;border-left:1px solid #262626}
.stat:first-child{border-left:0}
.stat .n{font-size:clamp(40px,5vw,60px);font-weight:800;color:var(--red);letter-spacing:-.03em;line-height:1}
.stat .l{margin-top:10px;color:#bdbdbd;font-size:15px}

/* about */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:start}
.about.single{grid-template-columns:1fr;max-width:820px}
.abt{margin-top:28px}
.abt p{font-size:18px;color:#333;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:56px}
.card{background:#fff;border-top:4px solid var(--red);padding:28px;box-shadow:0 0 0 1px #ececec,0 10px 28px rgba(0,0,0,.05)}
.card h3{font-size:22px;margin-bottom:10px;letter-spacing:-.01em}
.card p{margin:0;color:#444;font-size:16px}

/* pictures */
.pic{position:relative;background:#111}
.pic img{width:100%;height:100%;object-fit:cover}
.pic.tall{aspect-ratio:4/5}
.pic.empty{min-height:180px;border:2px dashed #bbb;background:#fafafa;display:flex;align-items:center;justify-content:center}
.pic .ph{color:#aaa;font-size:13px}
.picbtns{display:flex;gap:6px;flex-wrap:wrap}
.pic>.picbtns{position:absolute;left:8px;bottom:8px;z-index:3}

/* next band */
.next{background:var(--red);color:#fff;padding:64px 0}
.nextin{display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap}
.next .lab{letter-spacing:.14em;text-transform:uppercase;font-size:13px;font-weight:700}
.next h3{font-size:clamp(34px,5vw,60px);font-weight:800;letter-spacing:-.03em;margin:8px 0}
.next .meta{font-size:18px}
.next .btn{background:#fff;color:var(--red);border-color:#fff}
.next .btn:hover{background:#111;color:#fff;border-color:#111}
.next .fld{color:#fff}

/* announcements */
.abar{background:var(--red);color:#fff;font-size:14px}
.abarin{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center;position:relative;padding:9px 44px}
.abtag{background:#fff;color:var(--red);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:2px}
.abtx{font-weight:600}
.abar a{color:#fff;font-weight:700;text-decoration:underline}
.abx{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:4px 8px}
.ann{background:#fff;border:1px solid #e6e6e6;border-top:4px solid var(--red);display:flex;flex-direction:column}
.ann .pic{aspect-ratio:16/10}
.ann .body{padding:24px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;flex:1}
.ann .body>div{align-self:stretch}
.ann h3{font-size:26px;letter-spacing:-.02em}
.ann p{margin:0;color:#444;font-size:16px}
.ann .body>a.btn{margin-top:auto}
.annmeta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.atag{background:var(--red);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
.adate{color:#777;font-size:13px}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;margin:10px 0;color:#444;cursor:pointer}

/* news badge + entrance pop-up */
.lk.news{display:inline-flex;align-items:center}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:7px;border-radius:9px;background:#ed4245;color:#fff;font-size:11px;font-weight:800;line-height:1;box-shadow:0 0 0 2px #0a0a0a;animation:bdg 2.4s ease-in-out infinite}
@keyframes bdg{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
#annpop{max-width:540px;width:calc(100% - 32px);padding:0;border-top:5px solid var(--red);box-shadow:0 30px 80px rgba(0,0,0,.5);max-height:calc(100vh - 32px);overflow-x:hidden;overflow-y:auto}
#annpop[open]{animation:popin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes popin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
#annpop .pimg{aspect-ratio:16/9;background:#111}
#annpop .pimg img{width:100%;height:100%;object-fit:cover}
#annpop .pbody{padding:26px 28px 24px}
#annpop h3{font-size:30px;letter-spacing:-.02em;margin:14px 0 10px}
#annpop p{margin:0 0 22px;color:#444;font-size:16px}
#annpop .pnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid #eee}
.dots{display:flex;gap:7px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:#ccc;cursor:pointer}
.dots button.on{background:var(--red)}
.pclose{position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.pclose:hover{background:var(--red)}
@media(prefers-reduced-motion:reduce){#annpop[open],.badge{animation:none}}

/* mobile menu */
.burger{display:none;flex-direction:column;justify-content:center;gap:5px;width:42px;height:42px;background:none;border:0;cursor:pointer;padding:10px}
.burger span{display:block;height:2px;background:#fff;transition:transform .2s,opacity .2s}
nav.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
nav.open .burger span:nth-child(2){opacity:0}
nav.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu{display:none;position:absolute;left:0;right:0;top:100%;background:rgba(10,10,10,.98);border-bottom:1px solid #222;padding:6px 24px 18px;flex-direction:column;max-height:calc(100vh - 64px);overflow-y:auto}
.menu a{color:#e5e5e5;text-decoration:none;padding:13px 0;border-bottom:1px solid #1d1d1d;font-weight:600;font-size:15px}

/* speakers */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px}
.chip{font:inherit;font-size:13px;font-weight:700;padding:8px 16px;border:2px solid #111;background:transparent;color:#111;cursor:pointer;border-radius:999px}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip.on{background:#111;color:#fff;border-color:#111}
.spks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px}
.spk{display:flex;flex-direction:column;background:#fff;border:1px solid #e6e6e6;border-top:4px solid var(--red)}
.spk .pic{aspect-ratio:4/5}
.spk .noimg{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#161616,#3a0f0b);color:#fff;font-size:72px;font-weight:800}
.spk .body{padding:20px;display:flex;flex-direction:column;gap:6px;flex:1}
.spk h3{font-size:22px;letter-spacing:-.01em}
.sev{color:var(--red);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.srole{color:#666;font-size:14px}
.stalk{font-weight:700;font-style:italic;margin-top:4px}
.sbio{margin:4px 0 0;font-size:14px;color:#555}
.spk a.more{margin-top:auto;padding-top:10px;font-weight:700;color:var(--red);text-decoration:none;font-size:14px}

/* sponsors */
.tier{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#777;margin:40px 0 16px}
.tier:first-child{margin-top:0}
.sps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.sps.edit{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sp{background:#fff;border:1px solid #e6e6e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;min-height:140px;text-align:center;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
a.sp:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.08)}
.sp img{max-width:100%;max-height:72px;object-fit:contain}
.sp .sn{font-weight:700;font-size:15px}
.stier{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.08em}
.sp .fld{width:100%;text-align:left}
.sp .ctl{justify-content:center}

/* registration */
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px;align-items:start}
.reg{background:#fff;border:1px solid #e6e6e6;border-top:4px solid var(--red);padding:28px;display:flex;flex-direction:column;gap:10px}
.reg h3{font-size:28px;letter-spacing:-.02em}
.reg .when{color:#666;font-size:14px}
.reg p{margin:0;color:#444;font-size:16px}
.rmeta{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#f0f0f0;color:#333}
.pill.ok{background:#e7f6ec;color:#146c2e}
.pill.no{background:#fdeceb;color:#a3190f}
.reg>.btn{align-self:flex-start;margin-top:6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.radm{border-top:1px dashed #ddd;margin-top:6px;padding-top:6px}
.thx{font-size:14px;color:#555;border:1px dashed #ccc;padding:8px;margin:4px 0 8px}
.rfields{margin-top:8px}
.rfields summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0}
.rfld{border:1px solid #e6e6e6;background:#fafafa;padding:10px 12px;margin:8px 0}
.rfld .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rfld .sel{width:auto;flex:1;min-width:140px}

/* registration form dialog + responses viewer */
#regdlg{max-width:520px;padding:28px;max-height:calc(100vh - 32px);overflow-y:auto;border-top:5px solid var(--red)}
#regdlg h3{font-size:28px;letter-spacing:-.02em;margin-bottom:6px}
#regdlg p{margin:0 0 6px;color:#555}
#regdlg label.f{display:block;font-size:13px;font-weight:700;margin-top:16px;color:#222}
#regdlg label.f input:not([type=checkbox]),#regdlg label.f select,#regdlg label.f textarea{display:block;width:100%;margin:6px 0 0;font:inherit;font-size:16px;padding:11px 12px;border:2px solid #111;border-radius:2px;background:#fff;color:#111}
#regdlg label.f input:focus,#regdlg label.f select:focus,#regdlg label.f textarea:focus{outline:none;border-color:var(--red)}
#regdlg label.ck2{display:flex;gap:10px;align-items:flex-start;font-weight:600}
#regdlg label.ck2 input{width:auto;margin:3px 0 0;padding:0}
#regdlg .req{color:var(--red)}
#regdlg .err{margin:14px 0 0}
#regdlg .cta{margin-top:12px}
  #regdlg .fgrp{display:block;font-size:13px;font-weight:700;margin-top:16px;color:#222}
#regdlg .fgrp .hint{display:block;font-weight:400;color:#555;margin-top:4px;font-size:13px}
#regdlg .fgrp label.f{margin-top:8px;font-weight:600}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;opacity:0}
#respdlg{max-width:1000px;width:calc(100% - 32px);padding:24px;max-height:calc(100vh - 32px);overflow:auto}
#respdlg h3{font-size:24px}
.rtw{overflow-x:auto;margin:14px 0;border:1px solid #e6e6e6}
.rt{border-collapse:collapse;width:100%;font-size:13px}
.rt th,.rt td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap;vertical-align:top}
.rt th{background:#f5f5f5}
.rt td.wr{white-space:pre-wrap;min-width:180px}

/* events */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.ev{background:#fff;border:1px solid #e6e6e6;border-top:4px solid var(--red);display:flex;flex-direction:column}
.ev .pic{aspect-ratio:16/10}
.ev .body{padding:24px;display:flex;flex-direction:column;gap:8px;flex:1}
.ev .yr{color:var(--red);font-weight:800;font-size:15px;letter-spacing:.1em}
.ev h3{font-size:28px;letter-spacing:-.02em}
.ev .when{color:#666;font-size:14px}
.ev p{margin:0;color:#444;font-size:16px}
.ev a.more{margin-top:auto;padding-top:12px;font-weight:700;color:var(--red);text-decoration:none;font-size:14px}

/* gallery */
.gal{columns:3 260px;column-gap:16px}
.gal figure{margin:0 0 16px;break-inside:avoid;position:relative}
.gal figure:not(.slot){cursor:zoom-in}
.gal .pic img{height:auto}
.gal figcaption{font-size:13px;color:#bdbdbd;padding-top:6px}

/* videos */
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:28px}
.vid iframe{width:100%;height:540px;border:0;background:#000}
.vid.wide iframe{height:auto;aspect-ratio:16/9}
.vid video{display:block;width:100%;max-height:560px;background:#000;object-fit:contain}
.vid .vt{font-weight:700;margin-top:10px}
.vup{margin:10px 0;padding:12px;border:1px dashed #bbb;background:#fafafa}
.vup .note{font-size:12px;color:#666;margin:8px 0 0}
.vup .bar{height:8px;background:#e6e6e6;border-radius:4px;overflow:hidden;margin-top:8px}
.vup .bar i{display:block;height:100%;width:0;background:var(--red);transition:width .15s}
.vup .tx{font-size:12px;color:#444;margin-top:6px}
.vid a.vl{display:block;padding:28px;background:#111;color:#fff;text-decoration:none;font-weight:700}

/* team */
.treewrap{overflow-x:auto;padding:4px 16px 28px;box-sizing:border-box}
.tree{width:max-content;min-width:100%;transform-origin:top left}
.tree ul{list-style:none;margin:0;padding:28px 0 0;display:flex;justify-content:center;position:relative}
.tree>ul{padding-top:0}
.tree li{position:relative;padding:28px 12px 0;display:flex;flex-direction:column;align-items:center}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:28px;border-top:2px solid var(--red)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--red)}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:2px solid var(--red);border-radius:0 8px 0 0}
.tree li:first-child::after{border-radius:8px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:28px;border-left:2px solid var(--red)}
.role{background:#fff;border:1px solid #e6e6e6;border-top:4px solid var(--red);padding:24px;width:264px;flex:none;text-align:left}
.role h3{font-size:20px;letter-spacing:-.01em}
.rep{color:#888;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:4px 0 18px}
.role h3+.ppl,.role h3+.tba{margin-top:16px}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:20px 12px}
.pp{text-align:center}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 8px;background:#1b1b1b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.pn{font-size:14px;font-weight:600;line-height:1.3}
.tba{color:#999;font-size:14px}

/* ---------- video upload (straight to storage via a signed URL) ---------- */
var VID_TYPES = { mp4: "video/mp4", webm: "video/webm", mov: "video/quicktime" };
var VID_MAX = 50 * 1024 * 1024;
var vidBusy = new WeakMap();   // video item -> { pct, el, tx }  (kept out of saved data)
var vidCount = 0;

function vidType(f) {
  if (VID_TYPES[(f.name.split(".").pop() || "").toLowerCase()] && !/^video\//.test(f.type)) return VID_TYPES[f.name.split(".").pop().toLowerCase()];
  return f.type || VID_TYPES[(f.name.split(".").pop() || "").toLowerCase()] || "";
}
function vidProgress(v, pct, text) {
  var b = vidBusy.get(v); if (!b) return;
  b.pct = pct; b.text = text || b.text;
  if (b.bar) b.bar.style.width = pct + "%";
  if (b.tx) b.tx.textContent = b.text;
}
function uploadVideo(v, file) {
  var type = vidType(file);
  if (["video/mp4", "video/webm", "video/quicktime"].indexOf(type) === -1) { toast("Only MP4, WEBM or MOV videos", true); return; }
  if (file.size > VID_MAX) { toast("That video is " + Math.round(file.size / 1048576) + " MB. The limit is 50 MB. Compress or trim it and try again.", true); return; }
  if (vidBusy.has(v)) return;
  vidBusy.set(v, { pct: 0, text: "Preparing upload…" }); vidCount++;
  render();
  fetch(SB_URL + "/functions/v1/upload-media", {
    method: "POST",
    headers: { apikey: SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ password: password, action: "sign", type: type })
  }).then(function (r) {
    return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Could not start upload"); return j; });
  }).then(function (j) {
    return new Promise(function (resolve, reject) {
      var fd = new FormData();
      fd.append("cacheControl", "31536000");
      fd.append("", new Blob([file], { type: type }), file.name);
      var x = new XMLHttpRequest();
      x.open("PUT", j.uploadUrl);
      x.setRequestHeader("apikey", SB_KEY);
      x.setRequestHeader("x-upsert", "false");
      x.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        var p = Math.round(e.loaded / e.total * 100);
        vidProgress(v, p, "Uploading… " + p + "% (" + Math.round(e.loaded / 1048576) + " / " + Math.round(e.total / 1048576) + " MB)");
      };
      x.onload = function () {
        if (x.status >= 200 && x.status < 300) return resolve(j.publicUrl);
        var m = ""; try { var b = JSON.parse(x.responseText); m = b.message || b.error || ""; } catch (e) {}
        reject(new Error(m || ("Upload failed (" + x.status + ")")));
      };
      x.onerror = function () { reject(new Error("Network error during upload")); };
      x.onabort = function () { reject(new Error("Upload cancelled")); };
      x.send(fd);
    });
  }).then(function (url) {
    vidBusy.delete(v); vidCount--;
    v.url = url; dirty = true; render();
    toast("Video uploaded. Press Save to publish.");
  }).catch(function (e) {
    vidBusy.delete(v); vidCount--;
    render(); toast("Video upload failed: " + e.message, true);
  });
}
function pickVideo(v) {
  var i = document.createElement("input");
  i.type = "file"; i.accept = "video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov";

/* ---------- countdowns ---------- */
var TZ = "Africa/Cairo";   // time zone the event times are typed in (so everyone sees the same moment)
var cdFmt = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric" });
function tzOff(ts) {
  var p = {};
  cdFmt.formatToParts(new Date(ts)).forEach(function (x) { p[x.type] = +x.value; });
  return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(ts / 1000) * 1000;
}
function cdTime(s) {   // "2026-12-05T18:00" typed in event time -> real timestamp, or NaN
  var m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(s || "");
  if (!m) return NaN;
  var g = Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5]);
  return g - tzOff(g - tzOff(g));
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function cdEl(str, o) {   // o: { compact, done, rerender }
  o = o || {};
  var t = cdTime(str);
  if (isNaN(t)) return null;
  var e = h("span", { class: "cd" + (o.compact ? " cdc" : ""), "data-t": t, "data-done": o.done || "Started" });
  if (o.rerender) e.setAttribute("data-rr", "1");
  if (!o.compact) ["Days", "Hours", "Min", "Sec"].forEach(function (u) {
    e.append(h("span", { class: "cdu" }, h("b", null, "00"), h("i", null, u)));
  });
  cdTick(e);
  return e;
}
function cdTick(e) {
  if (e.getAttribute("data-fin") === "1") return;
  var ms = +e.getAttribute("data-t") - Date.now();
  if (ms <= 0) {
    e.setAttribute("data-fin", "1");
    e.textContent = e.getAttribute("data-done");
    e.classList.add("cdend");
    if (e.getAttribute("data-live") === "1" && e.hasAttribute("data-rr") && !editing) render();
    return;
  }
  e.setAttribute("data-live", "1");
  var s = Math.floor(ms / 1000), d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  if (e.classList.contains("cdc")) { e.textContent = (d ? d + "d " : "") + pad2(hh) + "h " + pad2(mm) + "m " + pad2(ss) + "s"; return; }
  var b = e.querySelectorAll("b");
  b[0].textContent = d; b[1].textContent = pad2(hh); b[2].textContent = pad2(mm); b[3].textContent = pad2(ss);
}
setInterval(function () { document.querySelectorAll(".cd").forEach(cdTick); }, 1000);

/* ---------- login / save ---------- */
function openLogin() {
  var d = document.getElementById("login");
  document.getElementById("pw").value = ""; document.getElementById("loginerr").textContent = "";
  d.showModal(); document.getElementById("pw").focus();
}
function doLogin() {
  var pw = document.getElementById("pw").value, err = document.getElementById("loginerr"), go = document.getElementById("loginGo");
  if (!pw) return;
  go.disabled = true; err.textContent = "Checking…";
  api("rpc/verify_board", { method: "POST", body: JSON.stringify({ p: pw }) }).then(function (ok) {
    go.disabled = false;
    if (ok === true) {
      password = pw; editing = true;
      document.getElementById("login").close(); render();
      toast("Board edit mode is on. Click any text to edit it.");
    } else { err.textContent = "Wrong password."; document.getElementById("pw").value = ""; }
  }).catch(function (e) { go.disabled = false; err.textContent = "Error: " + e.message; });
}
function logout() {
  if (dirty && !confirm("You have unsaved changes. Log out and discard them?")) return;
  password = null; editing = false;
  if (dirty) { dirty = false; load(); } else render();
}
function save() {
  if (!loaded) { toast("Content did not load. Refresh the page before saving.", true); return; }
  toast("Saving…");
  api("rpc/save_hierarchy", { method: "POST", body: JSON.stringify({ p: password, d: { roles: state.roles, site: state.site } }) })
    .then(function () { dirty = false; markDirty(); toast("Saved. Your changes are live."); })

}

  function trackVisit() {

  var today = new Date().toISOString().slice(0, 10), first = true;
  try { first = localStorage.getItem("tedx-vd") !== today; localStorage.setItem("tedx-vd", today); } catch (e) {}
  api("rpc/track_visit", { method: "POST", body: JSON.stringify({ u: first }), keepalive: true }).catch(function () {});
}
