<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEDx Team Hierarchy</title>
</head>
<body>

<h1>TEDx Team Hierarchy</h1>

<div id="bar"></div>
<p id="msg"></p>
<hr>
<div id="tree">Loading...</div>

<script>
var SB_URL = "https://fdiounclxvaescxfkcnt.supabase.co";
var SB_KEY = "sb_publishable_pTmK9ZuSQHh915Ke4IAhIA_ib2ip80H";

var roles = [];
var password = null;   // kept in memory only, never stored
var editing = false;
var dirty = false;

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({
    "apikey": SB_KEY,
    "Content-Type": "application/json"
  }, opts.headers || {});
  return fetch(SB_URL + "/rest/v1/" + path, opts).then(function (r) {
    return r.text().then(function (t) {
      var j = t ? JSON.parse(t) : null;
      if (!r.ok) throw new Error((j && (j.message || j.hint)) || "Request failed");
      return j;
    });
  });
}

function say(t) { document.getElementById("msg").textContent = t || ""; }

function newId() { return "r" + Date.now().toString(36) + Math.floor(Math.random() * 1000); }

function el(tag, text) {
  var e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  return e;
}

function button(label, fn) {
  var b = el("button", label);
  b.type = "button";
  b.onclick = fn;
  return b;
}

function byId(id) { return roles.filter(function (r) { return r.id === id; })[0]; }
function children(id) { return roles.filter(function (r) { return r.parent === id; }); }

function descendants(id) {
  var out = [];
  children(id).forEach(function (c) { out.push(c.id); out = out.concat(descendants(c.id)); });
  return out;
}

/* ---------- load ---------- */
function load() {
  say("Loading...");
  api("team_hierarchy?id=eq.1&select=data").then(function (rows) {
    roles = (rows[0] && rows[0].data && rows[0].data.roles) || [];
    dirty = false;
    say("");
    render();
  }).catch(function (e) { say("Could not load: " + e.message); });
}

/* ---------- top bar ---------- */
function renderBar() {
  var bar = document.getElementById("bar");
  bar.innerHTML = "";
  if (!editing) {
    bar.appendChild(button("Board login", showLogin));
  } else {
    bar.appendChild(el("b", "Board mode. "));
    bar.appendChild(button("Add top-level role", function () {
      roles.push({ id: newId(), name: "New role", parent: null, people: [] });
      dirty = true; render();
    }));
    bar.appendChild(document.createTextNode(" "));
    bar.appendChild(button("Save", save));
    bar.appendChild(document.createTextNode(" "));
    bar.appendChild(button("Log out", logout));
  }
}

function showLogin() {
  var bar = document.getElementById("bar");
  bar.innerHTML = "";
  var form = el("div");
  var input = el("input");
  input.type = "password";
  input.placeholder = "Board password";
  input.autocomplete = "current-password";
  input.onkeydown = function (e) { if (e.key === "Enter") go(); };
  function go() {
    var p = input.value;
    if (!p) return;
    say("Checking...");
    api("rpc/verify_board", { method: "POST", body: JSON.stringify({ p: p }) })
      .then(function (ok) {
        if (ok === true) { password = p; editing = true; say("Logged in."); render(); }
        else { say("Wrong password."); input.value = ""; input.focus(); }
      })
      .catch(function (e) { say("Error: " + e.message); });
  }
  form.appendChild(input);
  form.appendChild(document.createTextNode(" "));
  form.appendChild(button("Enter", go));
  form.appendChild(document.createTextNode(" "));
  form.appendChild(button("Cancel", function () { say(""); render(); }));
  bar.appendChild(form);
  input.focus();
}

function logout() {
  if (dirty && !confirm("You have unsaved changes. Log out anyway?")) return;
  password = null; editing = false;
  if (dirty) { load(); } else { render(); }
  say("");
}

/* ---------- save ---------- */
function save() {
  say("Saving...");
  api("rpc/save_hierarchy", {
    method: "POST",
    body: JSON.stringify({ p: password, d: { roles: roles } })
  }).then(function () {
    dirty = false;
    say("Saved.");
  }).catch(function (e) { say("Save failed: " + e.message); });
}

/* ---------- tree ---------- */
function render() {
  renderBar();
  var tree = document.getElementById("tree");
  tree.innerHTML = "";
  var tops = roles.filter(function (r) { return !r.parent || !byId(r.parent); });
  if (!tops.length) { tree.textContent = "No roles yet."; return; }
  var ul = el("ul");
  tops.forEach(function (r) { ul.appendChild(node(r)); });
  tree.appendChild(ul);
}

function node(r) {
  var li = el("li");
  if (!editing) {
    li.appendChild(el("b", r.name));
    if (r.people && r.people.length) {
      var pl = el("ul");
      r.people.forEach(function (p) { pl.appendChild(el("li", p)); });
      li.appendChild(pl);
    }
  } else {
    var name = el("input");
    name.value = r.name;
    name.placeholder = "Role name";
    name.oninput = function () { r.name = name.value; dirty = true; };
    li.appendChild(name);

    li.appendChild(document.createTextNode(" Reports to: "));
    var sel = el("select");
    var blocked = descendants(r.id).concat([r.id]);
    var none = el("option", "(top level)"); none.value = ""; sel.appendChild(none);
    roles.forEach(function (o) {
      if (blocked.indexOf(o.id) !== -1) return;
      var opt = el("option", o.name); opt.value = o.id; sel.appendChild(opt);
    });
    sel.value = r.parent || "";
    sel.onchange = function () { r.parent = sel.value || null; dirty = true; render(); };
    li.appendChild(sel);

    li.appendChild(document.createTextNode(" "));
    li.appendChild(button("Add sub-role", function () {
      roles.push({ id: newId(), name: "New role", parent: r.id, people: [] });
      dirty = true; render();
    }));
    if (r.id !== "r1") {
      li.appendChild(document.createTextNode(" "));
      li.appendChild(button("Delete", function () {
        var n = descendants(r.id).length;
        var m = "Delete \"" + r.name + "\"" + (n ? " and its " + n + " sub-role(s)" : "") + "?";
        if (!confirm(m)) return;
        var gone = descendants(r.id).concat([r.id]);
        roles = roles.filter(function (x) { return gone.indexOf(x.id) === -1; });
        dirty = true; render();
      }));
    }

    li.appendChild(el("br"));
    li.appendChild(document.createTextNode("People (one per line):"));
    li.appendChild(el("br"));
    var ta = el("textarea");
    ta.rows = Math.max(2, (r.people || []).length + 1);
    ta.cols = 30;
    ta.value = (r.people || []).join("\n");
    ta.oninput = function () {
      r.people = ta.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      dirty = true;
    };
    li.appendChild(ta);
  }

  var kids = children(r.id);
  if (kids.length) {
    var ul = el("ul");
    kids.forEach(function (k) { ul.appendChild(node(k)); });
    li.appendChild(ul);
  }
  return li;
}

window.onbeforeunload = function () { return dirty ? "Unsaved changes" : undefined; };

load();
</script>

</body>
</html>
